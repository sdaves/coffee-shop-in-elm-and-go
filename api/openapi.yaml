openapi: 3.1.0
info:
  title: Acme Coffee Store API
  version: 1.0.0
  description: >
    A real-world REST API generated by gosqlapi over a local SQLite database
    (`store.db`). The catalog is publicly readable; customer PII, orders and
    business reports require a bearer token.
  contact:
    name: Platform Team
    email: platform@acme.example
  license:
    name: MIT

servers:
  - url: http://127.0.0.1:8080
    description: Local development

security:
  - bearerAuth: []

tags:
  - name: Catalog
    description: Public product catalog
  - name: Customers
    description: Customer records (PII, authenticated)
  - name: Orders
    description: Orders and line items (authenticated)
  - name: Reports
    description: Pre-defined SQL reports
  - name: Admin
    description: Schema/seed management

paths:
  /store/products:
    get:
      tags: [Catalog]
      summary: List products
      security: []
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/OrderBy'
        - $ref: '#/components/parameters/ShowTotal'
        - name: category
          in: query
          description: Exact-match filter on CATEGORY (any column can be filtered this way)
          schema: { type: string, example: coffee }
        - name: name
          in: query
          description: Exact-match filter on NAME
          schema: { type: string }
      responses:
        '200':
          description: Paged product list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductPage' }
    post:
      tags: [Catalog]
      summary: Create a product (authenticated)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Product' }
      responses:
        '200':
          description: Write result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WriteResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /store/products/{sku}:
    parameters:
      - $ref: '#/components/parameters/Sku'
    get:
      tags: [Catalog]
      summary: Get one product
      security: []
      responses:
        '200':
          description: Product
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Catalog]
      summary: Update a product (authenticated)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Product' }
      responses:
        '200':
          description: Write result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WriteResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      tags: [Catalog]
      summary: Delete a product (authenticated)
      responses:
        '200':
          description: Write result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WriteResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /store/customers:
    get:
      tags: [Customers]
      summary: List customers
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/OrderBy'
        - $ref: '#/components/parameters/ShowTotal'
        - name: country
          in: query
          schema: { type: string, example: US }
      responses:
        '200':
          description: Paged customer list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /store/customers/{customer_id}:
    parameters:
      - name: customer_id
        in: path
        required: true
        schema: { type: integer, example: 1 }
    get:
      tags: [Customers]
      summary: Get one customer
      responses:
        '200':
          description: Customer
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Customer' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /store/orders:
    get:
      tags: [Orders]
      summary: List orders
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/OrderBy'
        - $ref: '#/components/parameters/ShowTotal'
        - name: status
          in: query
          schema: { type: string, enum: [pending, paid, shipped, cancelled] }
        - name: customer_id
          in: query
          schema: { type: integer }
      responses:
        '200':
          description: Paged order list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /store/order_items:
    get:
      tags: [Orders]
      summary: List order line items
      parameters:
        - name: order_id
          in: query
          schema: { type: integer, example: 1 }
        - $ref: '#/components/parameters/OrderBy'
      responses:
        '200':
          description: Order item list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/OrderItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /store/low_stock:
    get:
      tags: [Reports]
      summary: Products at or below their reorder level (public)
      security: []
      responses:
        '200':
          description: >
            A bare array, because the script's single SELECT is unlabelled.
            (Add `-- @label: x` to the script to get `{"x": [...]}` instead.)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/StockRow' }

  /store/revenue_by_category:
    get:
      tags: [Reports]
      summary: Revenue grouped by product category (authenticated)
      responses:
        '200':
          description: Rows under the `revenue` label
          content:
            application/json:
              schema:
                type: object
                properties:
                  revenue:
                    type: array
                    items: { $ref: '#/components/schemas/RevenueRow' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [Reports]
      summary: Same as GET (legacy execution method)
      responses:
        '200': { description: Rows under the `revenue` label }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /store/init:
    patch:
      tags: [Admin]
      summary: Drop, recreate and seed the schema (authenticated, destructive)
      responses:
        '200':
          description: Seed confirmation
          content:
            application/json:
              schema:
                type: object
                properties:
                  seeded:
                    type: array
                    items:
                      type: object
                      properties:
                        STATUS: { type: string, example: ok }
        '401': { $ref: '#/components/responses/Unauthorized' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >
        Send the raw token from `gosqlapi.json` as `Authorization: Bearer <token>`.

  parameters:
    Sku:
      name: sku
      in: path
      required: true
      schema: { type: string, example: COF-ETH-1KG }
    PageSize:
      name: .page_size
      in: query
      description: Maximum records returned (overrides the table default)
      schema: { type: integer, minimum: 1, example: 20 }
    Offset:
      name: .offset
      in: query
      schema: { type: integer, minimum: 0, example: 0 }
    OrderBy:
      name: .order_by
      in: query
      description: SQL ORDER BY expression (overrides the table default)
      schema: { type: string, example: "PRICE_CENTS ASC" }
    ShowTotal:
      name: .show_total
      in: query
      schema: { type: integer, enum: [0, 1] }

  responses:
    Unauthorized:
      description: Missing or invalid bearer token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Record not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Product:
      type: object
      required: [SKU, NAME, CATEGORY, PRICE_CENTS]
      properties:
        SKU: { type: string, example: COF-ETH-1KG }
        NAME: { type: string, example: Ethiopia Yirgacheffe 1kg }
        CATEGORY: { type: string, example: coffee }
        PRICE_CENTS: { type: integer, example: 2499 }
        STOCK: { type: integer, example: 42 }
        REORDER_LEVEL: { type: integer, example: 10 }
        ACTIVE: { type: integer, enum: [0, 1] }
        IMAGE: { type: string, example: cof-eth-1kg.svg }
        DESCRIPTION: { type: string, example: Floral and citrus-forward washed coffee. }
    ProductPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/Product' }
    Customer:
      type: object
      properties:
        CUSTOMER_ID: { type: integer, example: 1 }
        EMAIL: { type: string, format: email }
        FULL_NAME: { type: string }
        COUNTRY: { type: string, example: US }
        CREATED_AT: { type: string, format: date-time }
    CustomerPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/Customer' }
    Order:
      type: object
      properties:
        ORDER_ID: { type: integer, example: 1 }
        CUSTOMER_ID: { type: integer }
        STATUS: { type: string, enum: [pending, paid, shipped, cancelled] }
        PLACED_AT: { type: string, format: date-time }
    OrderPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/Order' }
    OrderItem:
      type: object
      properties:
        ORDER_ITEM_ID: { type: integer }
        ORDER_ID: { type: integer }
        SKU: { type: string }
        QUANTITY: { type: integer }
        UNIT_PRICE_CENTS: { type: integer }
    StockRow:
      type: object
      properties:
        SKU: { type: string }
        NAME: { type: string }
        STOCK: { type: integer }
        REORDER_LEVEL: { type: integer }
    RevenueRow:
      type: object
      properties:
        CATEGORY: { type: string }
        ORDERS: { type: integer }
        UNITS: { type: integer }
        REVENUE_CENTS: { type: integer }
    Page:
      type: object
      properties:
        offset: { type: integer, example: 0 }
        page_size: { type: integer, example: 20 }
        total: { type: integer, example: 5 }
    WriteResult:
      type: object
      properties:
        last_insert_id: { type: integer }
        rows_affected: { type: integer }
    Error:
      type: object
      properties:
        error: { type: string }
